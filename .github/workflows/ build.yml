      - name: Build the APK
        working-directory: CoverWidget
        run: gradle assembleDebug --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp CoverWidget/app/build/outputs/apk/debug/app-debug.apk CoverWidget.apk
          gh release create "build-${{ github.run_number }}" CoverWidget.apk \
            --repo "${{ github.repository }}" \
            --title "Cover Widget (build ${{ github.run_number }})" \
            --notes "Tap CoverWidget.apk below to download it."

      - uses: actions/upload-artifact@v4
        with:
          name: CoverWidget-apk
          path: CoverWidget.apk
